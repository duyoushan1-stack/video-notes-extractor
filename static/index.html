<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Video Notes Extractor</title><style>
:root{font-family:system-ui,'Noto Sans TC',sans-serif;color:#243445;background:#f5f7f8}*{box-sizing:border-box}main{max-width:800px;margin:5vh auto;padding:24px}header{margin-bottom:24px}h1{font-size:clamp(26px,4vw,38px);letter-spacing:-1px}p{color:#64748b;line-height:1.7}.panel{background:white;padding:28px;border-radius:22px;box-shadow:0 12px 50px #19334b0c}label{display:block;font-weight:650;margin:18px 0 8px}input,select{width:100%;padding:14px;border:1px solid #d8e0e8;border-radius:10px;font:inherit}button,a.action{display:inline-block;border:0;border-radius:11px;background:#175d60;color:white;padding:13px 22px;font:inherit;cursor:pointer;text-decoration:none;margin-top:18px}button:disabled{opacity:.5;cursor:not-allowed}.row{display:flex;gap:14px;flex-wrap:wrap}.row>div{flex:1;min-width:160px}small{color:#718096}#result{white-space:pre-wrap;line-height:1.7;margin-top:20px}progress{width:100%;height:12px;accent-color:#175d60}#download{display:none}footer{margin-top:20px;font-size:13px;color:#64748b}
</style></head><body><main><header><h1>Video Notes Extractor</h1><p>貼上 YouTube 影片網址，自動偵測畫面變化、對齊逐字稿，匯出 Markdown 圖文筆記。</p></header><section class="panel"><form id="form"><label for="url">影片網址</label><input id="url" type="url" required value="https://www.youtube.com/watch?v=3C7kPucHpSk"><div class="row"><div><label for="threshold">場景偵測敏感度</label><input id="threshold" type="number" min="0.1" max="0.8" step="0.01" value="0.32"><small>數字越小越敏感；現在採用全片每 2 秒取樣與差異去重</small></div><div><label for="gap">最短截圖間隔（秒）</label><input id="gap" type="number" min="2" max="60" value="4"></div><div><label for="max">最多截圖張數</label><input id="max" type="number" min="1" max="300" value="300"></div></div><div class="row"><div><label><input id="summary" type="checkbox" style="width:auto"> 產出摘要（summary.md）</label><select id="summary-language" aria-label="摘要語系"><option value="zh-TW">繁體中文</option><option value="zh-CN">简体中文</option><option value="en">English</option><option value="ja">日本語</option><option value="ko">한국어</option></select></div><div><label for="translate">翻譯語系</label><select id="translate"><option value="">不翻譯</option><option value="zh-TW">繁體中文</option><option value="zh-CN">简体中文</option><option value="en">English</option><option value="ja">日本語</option><option value="ko">한국어</option></select></div></div><small>摘要、翻譯，以及無章節影片的 AI 自動分章，需在伺服器設定 GEMINI_API_KEY</small><br><button id="start" type="submit">開始擷取</button></form><div id="result" role="status" aria-live="polite"></div><progress id="progress" max="100" value="0" hidden></progress><a class="action" id="download">下載 ZIP</a></section><footer>個人使用 MVP。請勿公開部署未設身分驗證的服務；僅處理有權存取及保存的影片。</footer></main><script>
const form=document.getElementById('form'),result=document.getElementById('result'),progress=document.getElementById('progress'),start=document.getElementById('start'),download=document.getElementById('download');
form.addEventListener('submit',async e=>{e.preventDefault();start.disabled=true;download.style.display='none';progress.hidden=false;progress.value=0;result.textContent='正在建立任務…';try{const r=await fetch('/api/jobs',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({url:document.getElementById('url').value,threshold:Number(document.getElementById('threshold').value),min_gap:Number(document.getElementById('gap').value),max_frames:Number(document.getElementById('max').value),summary:document.getElementById('summary').checked,summary_language:document.getElementById('summary-language').value,translate:document.getElementById('translate').value})});const j=await r.json();if(!r.ok)throw Error(j.detail||'無法建立任務');let state=j;while(!['done','failed'].includes(state.status)){await new Promise(resolve=>setTimeout(resolve,2500));const response=await fetch('/api/jobs/'+j.id);if(!response.ok)throw Error('查詢任務失敗');state=await response.json();progress.value=state.progress||0;result.textContent=`狀態：${state.status}（${state.progress||0}%）`;}if(state.status==='failed')throw Error(state.error||'處理失敗');progress.value=100;result.textContent=`完成！截圖 ${state.frames} 張，逐字稿 ${state.cues} 段。${state.has_subtitles?'':'\n注意：此影片沒有可取得的字幕。'}${(state.warnings||[]).map(w=>'\n注意：'+w).join('')}`;download.href='/api/jobs/'+j.id+'/download';download.style.display='inline-block';}catch(err){result.textContent='錯誤：'+err.message;}finally{start.disabled=false;}});
</script></body></html>
